    });
    refreshClamp(el.timeline);
  }

  /**
   * 記録1件の表示を作る。inResults=true は絞り込み結果用。
   * どちらの画面でも「コピー」（内容だけ）・「転記済み」のチェック・本人の記録の編集と削除ができる。
   */
  function buildEntry(item, inResults) {
    var li = document.createElement('li');
    li.className = 'entry' + (item._pending ? ' is-pending' : '');
    var ops = '<button class="op-btn copy-btn">コピー</button>';
    ops += item.canEdit
      ? '<button class="op-btn edit-btn">編集</button><button class="op-btn danger del-btn">削除</button>'
      : '<span class="locked-note">本人のみ編集可</span>';
    li.innerHTML =
      '<div class="entry-time">' + escapeHtml(item.time) + '</div>' +
      '<div class="entry-card">' +
        '<div class="entry-meta">' +
          '<span class="chip chip-target">' + escapeHtml(item.target) + '</span>' +
          '<span class="chip chip-staff"' + (colorKey(item.staffColor) ? ' data-color="' + colorKey(item.staffColor) + '"' : '') + '>' + escapeHtml(item.staffName) + '</span>' +
          (item.tags || []).map(function (t) {
            var k = tagColorKey(t);
            return '<span class="chip chip-tag"' + (k ? ' data-color="' + k + '"' : '') + '>' + escapeHtml(t) + '</span>';
          }).join('') +
          (item.canEdit && !item._pending ? '<span class="chip chip-mine">自分の記録</span>' : '') +
          (item._pending ? '<span class="chip chip-pending">未送信</span>' : '') +
        '</div>' +
        '<div class="entry-view">' +
          '<div class="entry-content" data-id="' + escapeHtml(String(item.id)) + '">' + escapeHtml(item.content) + '</div>' +
          '<button type="button" class="more-btn" hidden>続きを表示 ▼</button>' +
          '<div class="entry-images" hidden></div>' +
          '<div class="entry-foot">' +
            '<label class="transcribe-label' + (item.transcribed ? ' done' : '') + '">' +
              '<input type="checkbox" class="transcribe-check"' + (item.transcribed ? ' checked' : '') + '> 福祉見聞録へ転記済み' +
            '</label>' +
            '<div class="entry-ops">' + ops + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    var card = li.querySelector('.entry-card');
    var cardColor = recordColorKey(item.tags);
    if (cardColor) card.setAttribute('data-color', cardColor);

    card.querySelector('.transcribe-check').addEventListener('change', function (e) {
      var checked = e.target.checked;
      if (inResults) {
        item.transcribed = checked; // 印刷にも反映されるよう、絞り込み結果の側も更新しておく
        e.target.parentNode.className = 'transcribe-label' + (checked ? ' done' : '');
      }
      requestToggle(item, checked);
    });

    var imgs = item.images || [];
    var imgBox = card.querySelector('.entry-images');
    if (imgs.length && ENABLE_IMAGES) {
      imgBox.hidden = false;
      imgs.forEach(function (img) { imgBox.appendChild(makeThumb(img)); });
    } else if (imgs.length) {
      var note = document.createElement('p');
      note.className = 'image-note';
      note.textContent = '📷 画像' + imgs.length + '枚（アプリ版で見られます）';
      imgBox.parentNode.insertBefore(note, imgBox);
    }

    card.querySelector('.copy-btn').addEventListener('click', function () { copyText(String(item.content || '')); });
    card.querySelector('.more-btn').addEventListener('click', function () {
      expandedIds[item.id] = !expandedIds[item.id];
      refreshClamp(card);
    });

    if (item.canEdit) {
      card.querySelector('.edit-btn').addEventListener('click', function () {
        enterEditMode(card, item, inResults ? afterResultEdit : null);
      });
      card.querySelector('.del-btn').addEventListener('click', function () {
        if (!confirm('この記録を削除します。よろしいですか？')) return;
        requestDelete(item);
        if (inResults && lastSearch) {
          // 絞り込み結果からも取り除く（印刷にも反映される）
          lastSearch.records = lastSearch.records.filter(function (r) { return r !== item; });
          renderResults();
        }
      });
    }
    return li;
  }

  /** 絞り込み結果で編集を保存／キャンセルしたあと、結果の一覧を描き直す */
  function afterResultEdit(saved, item, values) {
    if (saved) {
      item.time = values.time;
      item.target = values.target;
      item.content = values.content;
      if (values.images) item.images = values.images;
      if (values.tags) item.tags = values.tags;
      lastSearch.records.sort(function (a, b) {
        if (a.dateKey !== b.dateKey) return a.dateKey < b.dateKey ? -1 : 1;
        return a.time < b.time ? -1 : a.time > b.time ? 1 : 0;
      });
    }
    renderResults();
  }

  // ---------- コピー ----------

  var toastTimer = null;
  function showToast(msg) {
    el.toast.textContent = msg;
    el.toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.hidden = true; }, 1800);
  }

  /** 記録の内容だけをコピーする（対象者・時刻は含めない） */
  function copyText(text) {
    var done = function (ok) { showToast(ok ? 'コピーしました' : 'コピーできませんでした'); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallbackCopy(text)); });
        return;
      }
    } catch (e) { /* 下の方法で試す */ }
    done(fallbackCopy(text));
  }

  /** 古い端末や、クリップボードの利用が制限された画面向けのコピー */
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  /** 右上のボタン：日ごとの画面では「新しい記録」の欄へ、絞り込みでは条件の欄へ戻る */
  function jumpToInput() {
    var smooth = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    var start = window.scrollY;
    window.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' });
    // なめらかなスクロールが効かない端末では、そのまま一番上へ移す
    setTimeout(function () { if (start > 0 && window.scrollY >= start - 1) window.scrollTo(0, 0); }, 400);
  }

  // ---------- 絞り込み・印刷 ----------

  function setMode(mode) {
    viewMode = mode;
    var isDay = mode === 'day';
    el.modeDayBtn.setAttribute('aria-pressed', isDay ? 'true' : 'false');
    el.modeFilterBtn.setAttribute('aria-pressed', isDay ? 'false' : 'true');
    el.jumpBtn.textContent = isDay ? '✎ 入力へ' : '▲ 条件へ';
    el.dateNav.hidden = !isDay;
    el.composeCard.hidden = !isDay || !me;
    el.filterCard.hidden = isDay;
    el.resultSummary.hidden = isDay || !lastSearch;
    el.results.hidden = isDay || !lastSearch;
    el.resultPager.hidden = isDay || !lastSearch || !pagerOptions().length;
    if (isDay) {
      el.loadingMsg.hidden = !!me;
      render();
    } else {
      el.loadingMsg.hidden = true;
      el.timeline.hidden = true;
      el.emptyMsg.hidden = true;
    }
    window.scrollTo(0, 0);
  }

  function fillSelect(select, options) {
    var prev = select.value;
    select.innerHTML = '';
    var all = document.createElement('option');
    all.value = '';
    all.textContent = 'すべて';
    select.appendChild(all);
    options.forEach(function (opt) {
      var o = document.createElement('option');
      o.value = opt; o.textContent = opt;
      select.appendChild(o);
    });
    if (prev && options.indexOf(prev) !== -1) select.value = prev;
  }

  function populateFilterSelects() {
    fillSelect(el.fTarget, targetList);
    fillSelect(el.fStaff, staffNameList);
    fillSelect(el.fTag, tagList);
    fillExcludeTagSelect();
  }

  function fillExcludeTagSelect() {
    var saved = '';
    try { saved = localStorage.getItem(EXCLUDE_TAG_KEY) || ''; } catch (e) { /* 覚えられなくても動く */ }
    var prev = el.fExcludeTag.value || saved;
    el.fExcludeTag.innerHTML = '';
    var none = document.createElement('option');
    none.value = '';
    none.textContent = 'なし';
    el.fExcludeTag.appendChild(none);
    tagList.forEach(function (t) {
      var o = document.createElement('option');
      o.value = t; o.textContent = t;
      el.fExcludeTag.appendChild(o);
    });
    if (prev && tagList.indexOf(prev) !== -1) el.fExcludeTag.value = prev;
  }

  function shortDateLabel(key) {
    var p = key.split('-');
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return Number(p[1]) + '/' + Number(p[2]) + '(' + '日月火水木金土'.charAt(d.getDay()) + ')';
  }

  function doSearch() {
    clearError();
    var from = el.fFrom.value, to = el.fTo.value;
    if (!from || !to) { showError('開始日と終了日を指定してください。'); return; }
    if (from > to) { var tmp = from; from = to; to = tmp; el.fFrom.value = from; el.fTo.value = to; }
    var p1 = from.split('-'), p2 = to.split('-');
    var days = Math.round((new Date(+p2[0], +p2[1] - 1, +p2[2]) - new Date(+p1[0], +p1[1] - 1, +p1[2])) / 86400000) + 1;
    if (days > SEARCH_MAX_DAYS) { showError('期間は' + SEARCH_MAX_DAYS + '日（約3か月）以内で指定してください。'); return; }

    var q = {
      from: from, to: to,
      target: el.fTarget.value, staff: el.fStaff.value, tag: el.fTag.value, excludeTag: el.fExcludeTag.value,
      keyword: el.fKeyword.value.trim(), untranscribedOnly: el.fUntranscribed.checked
    };
    el.searchBtn.disabled = true;
    el.printBtn.disabled = true;
    el.results.hidden = true;
    el.resultPager.hidden = true;
    el.resultSummary.hidden = false;
    el.resultSummary.textContent = '検索中…（期間が長いと時間がかかります）';

    callServer('searchRecords', q, SEARCH_TIMEOUT_MS).then(function (res) {
      el.searchBtn.disabled = false;
      lastSearch = { q: q, records: (res && res.records) || [], truncated: !!(res && res.truncated) };
      pagerTarget = '';
      if (viewMode === 'filter') renderResults();
    }).catch(function (err) {
      el.searchBtn.disabled = false;
      el.resultSummary.textContent = '';
      el.resultSummary.hidden = true;
      showError(err && err.isTimeout
        ? '検索に時間がかかりすぎました。期間を短くして、もう一度お試しください。'
        : ((err && err.message) || '検索できませんでした。電波の良い場所でもう一度お試しください。'));
    });
  }

  /**
   * 「対象者：すべて」で検索したときに、利用者ごとにめくるための選択肢。
   * 利用者マスタの順（記録のない利用者も含む）に、マスタにない対象者の記録があれば後ろに足す。
   */
  function pagerOptions() {
    if (!lastSearch || lastSearch.q.target || !lastSearch.records.length) return [];
    var names = targetList.slice();
    lastSearch.records.forEach(function (r) {
      var t = String(r.target || '');
      if (names.indexOf(t) === -1) names.push(t);
    });
    return names;
  }

  function visibleResults() {
    if (!pagerTarget) return lastSearch.records;
    return lastSearch.records.filter(function (r) { return String(r.target || '') === pagerTarget; });
  }

  function renderPager() {
    var names = pagerOptions();
    el.resultPager.hidden = names.length === 0;
    if (!names.length) { pagerTarget = ''; return; }
    if (pagerTarget && names.indexOf(pagerTarget) === -1) pagerTarget = '';
    var count = {};
    lastSearch.records.forEach(function (r) { var t = String(r.target || ''); count[t] = (count[t] || 0) + 1; });
    el.pagerSelect.innerHTML = '';
    var all = document.createElement('option');
    all.value = '';
    all.textContent = 'すべての利用者（' + lastSearch.records.length + '件）';
    el.pagerSelect.appendChild(all);
    names.forEach(function (t) {
      var o = document.createElement('option');
      o.value = t;
      o.textContent = (t || '（対象者なし）') + '（' + (count[t] || 0) + '件）';
      el.pagerSelect.appendChild(o);
    });
    el.pagerSelect.value = pagerTarget;
    var i = pagerTarget ? names.indexOf(pagerTarget) : -1;
    el.pagerPrev.disabled = i === -1;            // 「すべて」より前はない
    el.pagerNext.disabled = i === names.length - 1;
    // 上の見出し（日付・ボタンの帯）の下に貼り付くようにする
    el.resultPager.style.top = (el.topbar ? el.topbar.offsetHeight : 0) + 'px';
  }

  function showPagerTarget(t) {
    pagerTarget = t || '';
    renderResults();
    // 切り替えたら、その人の記録の先頭が見えるようにする
    var top = el.resultPager.getBoundingClientRect().top;
    var stickTop = el.topbar ? el.topbar.offsetHeight : 0;
    if (top < stickTop - 1 || top > window.innerHeight / 2) {
      window.scrollTo(0, window.scrollY + top - stickTop);
    }
  }

  /** ‹ › で前後の利用者へ（「すべて」から › で先頭の利用者へ） */
  function stepPager(delta) {
    var names = pagerOptions();
    if (!names.length) return;
    var i = pagerTarget ? names.indexOf(pagerTarget) : -1;
    var next = i + delta;
    if (next < 0) { showPagerTarget(''); return; }
    if (next >= names.length) return;
    showPagerTarget(names[next]);
  }

  var PINNED_TAG = '翌日申し送り';

  /** 記録を日付ごとの見出し付きで結果欄に足す（見出しの頭に prefix を付ける） */
  function appendDateGroups(recs, prefix) {
    var currentDate = null, list = null;
    recs.forEach(function (item) {
      if (item.dateKey !== currentDate) {
        currentDate = item.dateKey;
        var head = document.createElement('h3');
        head.className = 'day-head';
        head.textContent = prefix + dateKeyLabel(currentDate);
        el.results.appendChild(head);
        list = document.createElement('ul');
        list.className = 'timeline';
        el.results.appendChild(list);
      }
      list.appendChild(buildEntry(item, true));
    });
  }

  function renderResults() {
    renderPager();
    var recs = visibleResults();
    el.resultSummary.hidden = false;
    if (pagerTarget) {
      el.resultSummary.textContent = recs.length
        ? (pagerTarget || '（対象者なし）') + '：' + recs.length + '件'
        : (pagerTarget || '（対象者なし）') + '：この期間の記録はありません。';
    } else {
      el.resultSummary.textContent = recs.length
        ? recs.length + '件' + (lastSearch.truncated ? '（件数が多いため、先頭の' + recs.length + '件だけを表示しています。条件を絞ってください）' : '')
        : '条件に合う記録はありませんでした。';
    }
    el.results.innerHTML = '';
    // 利用者ごとにめくっているときは、「翌日申し送り」の記録をその人の一番上にまとめて出す（朝の申し送りで最初に目に入るように）
    var isPinned = function (r) { return pagerTarget && (r.tags || []).indexOf(PINNED_TAG) !== -1; };
    appendDateGroups(recs.filter(isPinned), PINNED_TAG + '　');
    appendDateGroups(recs.filter(function (r) { return !isPinned(r); }), '');
    el.results.hidden = false;
    refreshClamp(el.results);
    el.printBtn.disabled = recs.length === 0;
  }

  /** 絞り込み結果を、印刷用の表にして印刷する（A4縦） */
  function doPrint() {
    if (!lastSearch) return;
    var printRecs = visibleResults();
    if (!printRecs.length) return;
    var q = lastSearch.q;
    var cond = [
      '期間：' + dateKeyLabel(q.from) + ' 〜 ' + dateKeyLabel(q.to),
      '対象者：' + (q.target || pagerTarget || 'すべて'),
      '記録者：' + (q.staff || 'すべて')
    ];
    if (q.tag) cond.push('タグ：' + q.tag);
    if (q.excludeTag) cond.push('除くタグ：' + q.excludeTag);
    if (q.keyword) cond.push('キーワード：「' + q.keyword + '」');
    if (q.untranscribedOnly) cond.push('未転記のみ');
    var now = new Date();
    var printedAt = now.getFullYear() + '/' + (now.getMonth() + 1) + '/' + now.getDate() + ' ' + nowHHMM();
    var rows = printRecs.map(function (r) {
      return '<tr>' +
        '<td>' + escapeHtml(shortDateLabel(r.dateKey)) + '</td>' +
        '<td>' + escapeHtml(r.time) + '</td>' +
        '<td>' + escapeHtml(r.target) + '</td>' +
        '<td>' + escapeHtml(r.staffName) + '</td>' +
        '<td class="c">' + ((r.tags && r.tags.length) ? escapeHtml('【' + r.tags.join('／') + '】') + '<br>' : '') + escapeHtml(r.content) + ((r.images && r.images.length) ? '\n（画像' + r.images.length + '枚）' : '') + '</td>' +
        '<td class="t">' + (r.transcribed ? '済' : '') + '</td>' +
      '</tr>';
    }).join('');
    el.printView.innerHTML =
      '<h1 class="pv-title">ボヤージュ支援記録ノート　記録一覧</h1>' +
      '<p class="pv-cond">' + escapeHtml(cond.join('　／　')) + '</p>' +
      '<p class="pv-meta">' + printRecs.length + '件' +
        (lastSearch.truncated ? '（件数が多いため一部のみ）' : '') +
        '　印刷日時：' + escapeHtml(printedAt) + '</p>' +
      '<table class="pv-table">' +
        '<colgroup><col style="width:5.4em"><col style="width:3.6em"><col style="width:7.5em"><col style="width:6.5em"><col><col style="width:3.4em"></colgroup>' +
        '<thead><tr><th>日付</th><th>時刻</th><th>対象者</th><th>記録者</th><th>内容</th><th>転記</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>';
    window.print();
  }

  /** onClose(saved, item, values) を渡すと、保存／キャンセル後の描き直しをその関数に任せる（絞り込み結果用） */
  function enterEditMode(card, item, onClose) {
    editingId = item.id;
    var viewEl = card.querySelector('.entry-view');
    var targetOptions = Array.from(el.targetSelect.options).map(function (o) { return o.value; });
    viewEl.outerHTML =
      '<div class="edit-form">' +
        '<div class="field-row">' +
          '<div><label class="hint">対象者</label><select class="edit-target"></select></div>' +
          '<div><label class="hint">時刻</label><input type="time" class="edit-time" value="' + escapeHtml(item.time) + '"></div>' +
        '</div>' +
        '<textarea class="edit-content">' + escapeHtml(item.content) + '</textarea>' +
        '<div class="tag-row edit-tags"></div>' +
        (ENABLE_IMAGES
          ? '<div class="photo-row edit-photos"><button type="button" class="photo-btn edit-photo-btn">📷 写真を追加</button>' +
            '<input type="file" class="edit-photo-input" accept="image/*" multiple hidden></div>'
          : '') +
        '<div class="edit-actions">' +
          '<button class="op-btn cancel-btn">キャンセル</button>' +
          '<button class="op-btn save save-btn">保存</button>' +
        '</div>' +
      '</div>';

    // 利用者マスタから外れた（部屋の入れ替わりなど）対象者の記録でも、元の対象者のまま編集できるよう選択肢に加える
    if (targetOptions.indexOf(item.target) === -1) targetOptions.unshift(item.target);
    populateSelect(card.querySelector('.edit-target'), targetOptions);
    card.querySelector('.edit-target').value = item.target;
    applyTimeMode(card.querySelector('.edit-time'));
    var editTags = (item.tags || []).slice();
    renderTagButtons(card.querySelector('.edit-tags'), editTags);

    var editImages = null;
    var addedInEdit = []; // この編集で新しく選んだ画像（キャンセルしたら端末から消す）
    if (ENABLE_IMAGES) {
      editImages = (item.images || []).slice();
      var row = card.querySelector('.edit-photos');
      var btn = card.querySelector('.edit-photo-btn');
      var redraw = function () { renderImageList(row, btn, editImages, function (removed) { idbDelete(removed.cid); }); };
      setupPhotoPicker(btn, card.querySelector('.edit-photo-input'), row, function () { return editImages; }, function () {
        var last = editImages[editImages.length - 1];
        if (last && last.cid) addedInEdit.push(last.cid);
        redraw();
      });
      redraw();
    }

    card.querySelector('.cancel-btn').addEventListener('click', function () {
      addedInEdit.forEach(function (cid) { idbDelete(cid); });
      editingId = null;
      if (onClose) onClose(false, item); else render();
    });
    card.querySelector('.save-btn').addEventListener('click', function () {
      var content = card.querySelector('.edit-content').value.trim();
      if (!content && !(editImages || item.images || []).length) return; // 写真が残っていれば本文なしでも保存できる
      var timeEl = card.querySelector('.edit-time');
      var time = readTimeInput(timeEl);
      if (!time) {
        timeEl.classList.add('invalid');
        showError('時刻は「0930」のように4桁の数字で入力してください（例：0930 → 09:30）。');
        timeEl.focus();
        return;
      }
      var values = { time: time, target: card.querySelector('.edit-target').value, content: content };
      editingId = null;
      if (editImages) values.images = editImages;
      values.tags = sortTags(editTags);
      requestUpdate(item, values.time, values.target, values.content, editImages || undefined, values.tags); // 先に送る（編集前の内容を「編集を始めたときの内容」として使う）
      if (onClose) onClose(true, item, values);
    });
  }

  init();
})();
</script>
</body>
</html>
